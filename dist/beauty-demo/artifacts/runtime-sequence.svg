<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="740" viewBox="0 0 1250 740"><title>beauty runtime sequence</title><rect width="100%" height="100%" fill="#f6f5ef"/><style>text{fill:#192d26;font-family:Arial,sans-serif}.wire{fill:none;stroke:#73886a;stroke-width:2}.request{stroke-dasharray:7 4}.context{stroke-dasharray:3 4}.platform{font-size:9px;fill:#69716a}.title{font-size:18px;font-family:Georgia,serif}.subtitle{font-size:11px;fill:#69716a}</style><defs><marker id="sequence" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0 0L12 6L0 12" fill="#577568"/></marker><marker id="sequence-incoming" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0 0L12 6L0 12" fill="#2469a2"/></marker><marker id="sequence-outgoing" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0 0L12 6L0 12" fill="#26764f"/></marker><marker id="sequence-both" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0 0L12 6L0 12" fill="#79569b"/></marker></defs><text x="35" y="45" font-size="27">Scoped business-question sequence</text><text x="35" y="77" font-size="12">Logical local calls; conditional paths run only when needed. Cloud endpoints are separate reference bindings.</text><rect x="25" y="103" width="230" height="45" rx="5" fill="#e9eddf"/><text x="140" y="130" text-anchor="middle" font-size="13">Business user</text><path d="M140 148L140 680" stroke="#b7c4ae" stroke-dasharray="5 4"/><rect x="345" y="103" width="230" height="45" rx="5" fill="#e9eddf"/><text x="460" y="130" text-anchor="middle" font-size="13">API / scoped tools</text><path d="M460 148L460 680" stroke="#b7c4ae" stroke-dasharray="5 4"/><rect x="665" y="103" width="230" height="45" rx="5" fill="#e9eddf"/><text x="780" y="130" text-anchor="middle" font-size="13">SQL metric layer</text><path d="M780 148L780 680" stroke="#b7c4ae" stroke-dasharray="5 4"/><rect x="985" y="103" width="230" height="45" rx="5" fill="#e9eddf"/><text x="1100" y="130" text-anchor="middle" font-size="13">Document corpus</text><path d="M1100 148L1100 680" stroke="#b7c4ae" stroke-dasharray="5 4"/><path class="wire" d="M140 187L460 187" marker-end="url(#sequence)"/><text x="153" y="178" font-size="12">Question + role + typed market</text><path class="wire" d="M460 247H520V270H460" marker-end="url(#sequence)"/><text x="530" y="262" font-size="11">Authorize / clarify unsupported requests</text><path class="wire" d="M460 307L780 307" marker-end="url(#sequence)"/><text x="473" y="298" font-size="12">If numeric: allowlisted scoped query</text><path class="wire request" d="M780 367L460 367" marker-end="url(#sequence)"/><text x="473" y="358" font-size="12">Calculated measure + definition + version</text><path class="wire" d="M460 427L1100 427" marker-end="url(#sequence)"/><text x="473" y="418" font-size="12">If context: filter ACLs, then score vectors</text><path class="wire request" d="M1100 487L460 487" marker-end="url(#sequence)"/><text x="473" y="478" font-size="12">Authorized chunks + source IDs</text><path class="wire" d="M460 547H520V570H460" marker-end="url(#sequence)"/><text x="530" y="562" font-size="11">Compose factual evidence / bounded fallback</text><path class="wire request" d="M460 607L140 607" marker-end="url(#sequence)"/><text x="153" y="598" font-size="12">Answer + SQL evidence + citations</text><text x="35" y="713" class="subtitle">Independent synthetic implementation · requests and results follow declared actor direction.</text></svg>
