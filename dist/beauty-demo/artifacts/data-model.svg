<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="730" viewBox="0 0 1250 730"><title>beauty logical data model</title><rect width="100%" height="100%" fill="#f6f5ef"/><style>text{fill:#192d26;font-family:Arial,sans-serif}.wire{fill:none;stroke:#73886a;stroke-width:2}.request{stroke-dasharray:7 4}.context{stroke-dasharray:3 4}.platform{font-size:9px;fill:#69716a}.title{font-size:18px;font-family:Georgia,serif}.subtitle{font-size:11px;fill:#69716a}</style><defs><marker id="entity" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0 0L12 6L0 12" fill="#73886a"/></marker><marker id="entity-incoming" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0 0L12 6L0 12" fill="#2469a2"/></marker><marker id="entity-outgoing" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0 0L12 6L0 12" fill="#26764f"/></marker><marker id="entity-both" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0 0L12 6L0 12" fill="#79569b"/></marker></defs><text x="35" y="45" font-size="27">Financial grain / independent document corpus</text><text x="35" y="78" font-size="12">Header, line and receipt grains remain separate. The corpus joins only as answer evidence, never as financial rows.</text><path class="wire" d="M365 224.5L450 224.5" marker-end="url(#entity)"><title>1:N invoice lines</title></path><path class="wire" d="M365 224.5L446 224.5L446 294L861 294L861 224.5L865 224.5" marker-end="url(#entity)"><title>1:N receipt applications</title></path><path class="wire" d="M450 224.5L369 224.5L369 425.5L365 425.5" marker-end="url(#entity)"><title>1:1 derived line fact</title></path><path class="wire" d="M365 224.5L446 224.5L446 425.5L450 425.5" marker-end="url(#entity)"><title>1:1 derived invoice fact</title></path><path class="wire" d="M865 224.5L784 224.5L784 425.5L780 425.5" marker-end="url(#entity)"><title>N:1 aggregate receipts before join</title></path><rect x="35" y="135" width="330" height="155" rx="7" fill="#fcfbf7" stroke="#adc0a1"/><text x="52" y="168" font-size="19">Invoice header</text><text x="52" y="201" font-size="12">PK: invoice_id</text><text x="52" y="228" font-size="12">market / USD / amount_cents</text><text x="52" y="255" font-size="12">due_date / source provenance</text><rect x="450" y="135" width="330" height="155" rx="7" fill="#fcfbf7" stroke="#adc0a1"/><text x="467" y="168" font-size="19">Sales line</text><text x="467" y="201" font-size="12">PK: line_id / FK: invoice_id</text><text x="467" y="228" font-size="12">units / returns / net_cents</text><text x="467" y="255" font-size="12">Line grain; reconcile to header</text><rect x="865" y="135" width="330" height="155" rx="7" fill="#fcfbf7" stroke="#adc0a1"/><text x="882" y="168" font-size="19">Receipt application</text><text x="882" y="201" font-size="12">PK: receipt_id / FK: invoice_id</text><text x="882" y="228" font-size="12">amount_cents / received_date</text><text x="882" y="255" font-size="12">Aggregate before joining invoices</text><rect x="35" y="360" width="330" height="155" rx="7" fill="#fcfbf7" stroke="#adc0a1"/><text x="52" y="393" font-size="19">Gold RGM fact</text><text x="52" y="426" font-size="12">PK: line_id (derived)</text><text x="52" y="453" font-size="12">gross / discount / net / profit</text><text x="52" y="480" font-size="12">Same validated publication version</text><rect x="450" y="360" width="330" height="155" rx="7" fill="#fcfbf7" stroke="#adc0a1"/><text x="467" y="393" font-size="19">Gold cashflow fact</text><text x="467" y="426" font-size="12">PK: invoice_id (derived)</text><text x="467" y="453" font-size="12">paid / outstanding / overdue</text><text x="467" y="480" font-size="12">Actual receipts; one invoice grain</text><rect x="865" y="360" width="330" height="155" rx="7" fill="#fcfbf7" stroke="#adc0a1"/><text x="882" y="393" font-size="19">Document / chunk corpus</text><text x="882" y="426" font-size="12">document_id / chunk_id</text><text x="882" y="453" font-size="12">paragraph / server ACL / vector</text><text x="882" y="480" font-size="12">Independent of finance table joins</text><text x="35" y="575" class="platform">RELATIONSHIPS / INVARIANTS</text><text x="35" y="603" font-size="12">invoice → line : 1:N invoice lines</text><text x="635" y="603" font-size="12">invoice → receipt : 1:N receipt applications</text><text x="35" y="629" font-size="12">line → rgm : 1:1 derived line fact</text><text x="635" y="629" font-size="12">invoice → cash : 1:1 derived invoice fact</text><text x="35" y="655" font-size="12">receipt → cash : N:1 aggregate receipts before join</text></svg>
